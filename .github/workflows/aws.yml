name: Build & Push Docker Images

on:
  push:
    branches:
      - main


permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: e-commerce

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - ai-service
          - api-gatway
          - auth-service
          - cart-service
          - config-server
          - inventory-service
          - order-service
          - payment-service
          - product-service
          - profile-service
          - search-service
          - server-registry

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug GitHub context
        run: |
          echo "Repository=$GITHUB_REPOSITORY"
          echo "Ref=$GITHUB_REF"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::889993502667:role/github-actions-role-e-commerce

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ matrix.service }}:${{ github.sha }} \
            ./${{ matrix.service }}

      - name: Tag Docker Image
        run: |
          docker tag \
            ${{ matrix.service }}:${{ github.sha }} \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ matrix.service }}-${{ github.sha }}

      - name: Push Docker Image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ matrix.service }}-${{ github.sha }}
