name: Build & Push Docker Images using GitHub Actions

on:
  push:
    branches:
      - main


permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: e-commerce

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - ai-service
          - api-gatway
          - auth-service
          - cart-service
          - config-server
          - inventory-service
          - order-service
          - payment-service
          - product-service
          - profile-service
          - search-service
          - server-registry

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug GitHub context
        run: |
          echo "Repository=$GITHUB_REPOSITORY"
          echo "Ref=$GITHUB_REF"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build JAR
        run: |
          cd ${{ matrix.service }}
          mvn clean package -DskipTests

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ matrix.service }}:${{ github.sha }} \
            ./${{ matrix.service }}

      - name: Tag Docker Image
        run: |
          docker tag \
            ${{ matrix.service }}:${{ github.sha }} \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ matrix.service }}-${{ github.sha }}

      - name: Push Docker Image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ matrix.service }}-${{ github.sha }}
