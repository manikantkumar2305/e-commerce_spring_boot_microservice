name: Build & Push Config Server to ECR

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: e-commerce
  SERVICE_NAME: config-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug GitHub Context
        run: |
          echo "Repository=$GITHUB_REPOSITORY"
          echo "Ref=$GITHUB_REF"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run Unit Tests
        working-directory: config-server
        run: mvn test

      - name: Build JAR
        working-directory: config-server
        run: mvn clean package -DskipTests

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ env.SERVICE_NAME }}:${{ github.sha }} \
            ./config-server

    #   - name: Run Trivy Image Scan
    #     uses: aquasecurity/trivy-action@0.35.0
    #     with:
    #       scan-type: image
    #       image-ref: ${{ env.SERVICE_NAME }}:${{ github.sha }}
    #       format: table
    #       exit-code: 1
    #       ignore-unfixed: true
    #       severity: HIGH,CRITICAL

      - name: Tag Docker Image
        run: |
          docker tag \
            ${{ env.SERVICE_NAME }}:${{ github.sha }} \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.SERVICE_NAME }}-${{ github.sha }}

      - name: Push Docker Image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.SERVICE_NAME }}-${{ github.sha }}