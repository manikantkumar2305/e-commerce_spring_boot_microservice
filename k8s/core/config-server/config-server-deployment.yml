apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      name: config-server
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: rajni2209/config-server:v1
          ports:
            - containerPort: 8888
          env:
            - name: EUREKA_URL
              value: http://server-registry:8761/eureka
