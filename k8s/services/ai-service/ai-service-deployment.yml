apiVersion: apps/v1
kind: Deployment

metadata:
  name: ai-service
  namespace: ecommerce

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ai-service

  template:
    metadata:
      labels:
        app: ai-service

    spec:
      containers:
        - name: ai-service
          image: rajni2209/ai-service:v1

          ports:
            - containerPort: 7070

          env:
            - name: DB_HOST
              value: mariadb

            - name: DB_PORT
              value: "3306"

          envFrom:
            - configMapRef:
                name: ecommerce-config

            - secretRef:
                name: ecommerce-secret