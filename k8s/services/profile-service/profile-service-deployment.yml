apiVersion: apps/v1
kind: Deployment

metadata:
  name: profile-service
  namespace: ecommerce

spec:
  replicas: 1

  selector:
    matchLabels:
      app: profile-service

  template:
    metadata:
      labels:
        app: profile-service

    spec:
      containers:
        - name: profile-service
          image: rajni2209/profile-service:v1

          ports:
            - containerPort: 9091

          env:
            - name: DB_HOST
              value: mysql

            - name: DB_PORT
              value: "3306"

          envFrom:
            - configMapRef:
                name: ecommerce-config

            - secretRef:
                name: ecommerce-secret