apiVersion: apps/v1
kind: Deployment

metadata:
  name: cart-service
  namespace: ecommerce

spec:
  replicas: 1

  selector:
    matchLabels:
      app: cart-service

  template:
    metadata:
      labels:
        app: cart-service

    spec:
      containers:
        - name: cart-service

          image: rajni2209/cart-service:v1

          ports:
            - containerPort: 9094

          env:
            - name: EUREKA_URL
              value: http://server-registry:8761/eureka

            - name: CONFIG_SERVER_URL
              value: http://config-server:8888

            - name: REDIS_HOST
              value: redis

            - name: REDIS_PORT
              value: "6379"

            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092