apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: mariadb
  namespace: ecommerce

spec:
  serviceName: mariadb

  replicas: 1

  selector:
    matchLabels:
      app: mariadb

  template:
    metadata:
      labels:
        app: mariadb

    spec:
      containers:
        - name: mariadb
          image: mariadb:11

          ports:
            - containerPort: 3306

          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secret
                  key: DB_PASSWORD

          volumeMounts:
            - name: mariadb-storage
              mountPath: /var/lib/mysql

            - name: mariadb-init-script
              mountPath: /docker-entrypoint-initdb.d

      volumes:
        - name: mariadb-storage
          persistentVolumeClaim:
            claimName: mariadb-pvc

        - name: mariadb-init-script
          configMap:
            name: mariadb-init-script